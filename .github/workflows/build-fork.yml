name: Build Fork Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-admission-vertex-hotfix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/jxnlexn/omniroute

jobs:
  build:
    name: Build and Push AMD64 Image
    if: github.repository == 'JxnLexn/OmniRoute'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release and retained fork features
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = "3.8.51"
          test -f src/shared/middleware/admissionBudget.ts
          test -f src/shared/middleware/ingestByteAdmission.ts
          grep -q "resolveLegacyCountCap" src/shared/middleware/chatBodyAdmission.ts
          test -f open-sse/config/vertexModels.ts
          test -f src/lib/providerModels/vertexModelDiscovery.ts
          grep -q "maybeHandleVertexModelDiscovery" src/app/api/providers/\[id\]/models/route.ts
          grep -q "getVertexModelTransport" open-sse/executors/vertex.ts
          test -f src/lib/providers/codexApiKeyServiceMode.ts
          test -f src/shared/components/ConnectionTestButton.tsx
          test -f src/lib/db/migrations/197_api_key_codex_service_mode.sql

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=3.8.51-leonapi
            type=raw,value=3.8.50-admission-vertex-hotfix
            type=raw,value=main
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=OmniRoute v3.8.51 LeonAPI
            org.opencontainers.image.description=OmniRoute v3.8.51 with retained LeonAPI fork changes
            org.opencontainers.image.url=https://github.com/JxnLexn/OmniRoute
            org.opencontainers.image.source=https://github.com/JxnLexn/OmniRoute
            org.opencontainers.image.version=3.8.51-leonapi
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fork-admission-vertex-hotfix-amd64
          cache-to: type=gha,scope=fork-admission-vertex-hotfix-amd64,mode=max
          provenance: mode=max
          sbom: true
